:root{--ink:#13224B;--gold:#C99A3E;--teal:#1F9E98;--ivory:#F6EFE0;--p:420px;--h:554px;--bw:840px;--lx:420px;--sx:0px;--ease:cubic-bezier(.19,1,.22,1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#080605;color:var(--ivory);font:400 15px/1.5 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}

.desk{position:fixed;inset:0;overflow:hidden;background:radial-gradient(55% 50% at 50% 46%,rgba(255,214,150,.22),rgba(255,214,150,.05) 48%,transparent 72%),#0a0807}

.cup{position:absolute;right:7%;bottom:13%;width:clamp(64px,9vw,118px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 46%,#2b1911 0 33%,#cdb083 34% 38%,#f2e9d7 39% 63%,#c8bea8 64%);box-shadow:0 16px 34px rgba(0,0,0,.65)}
.pen{position:absolute;left:6%;bottom:17%;width:clamp(100px,14vw,190px);height:8px;border-radius:5px;background:linear-gradient(#ecc872,#a47822);transform:rotate(-24deg);box-shadow:0 9px 15px rgba(0,0,0,.65)}
.top{position:fixed;z-index:20;inset:0 0 auto 0;padding:calc(env(safe-area-inset-top,0px) + 16px) clamp(16px,3vw,40px) 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}

.eb{font:600 10.5px/1.4 "IBM Plex Sans";letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}

.ivory{background:#F6EFE0;color:#1B2438}

.quote{font:italic 500 1.5em/1.2 "Cormorant Garamond",serif}
.ph{width:100%;height:46%;object-fit:cover;object-position:50% 14%;border-radius:2px;display:block}
.btn{display:inline-block;margin-top:auto;align-self:flex-start;padding:.75em 1.5em;border:1px solid currentColor;border-radius:75px;text-decoration:none;font-weight:600;font-size:.9em}
.btn:hover{background:var(--gold);color:#13224B;border-color:var(--gold)}
.cv{height:100%;padding:2.6em 2.2em;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(201,154,62,.35);margin:1.1em;height:calc(100% - 2.2em)}
.cv h1{margin:.2em 0 0;font:500 3.4em/.95 "Cormorant Garamond",serif}
.cv .sub{letter-spacing:.2em;font-size:.75em;text-transform:uppercase;color:#cdbf9f}

.mob .leaf.flipped{opacity:0;transition:transform 1.2s var(--ease),opacity .01s 1.2s}
.ctl{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:10px;align-items:center;max-width:96vw}

.lab{position:fixed;z-index:20;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 66px);text-align:center;font-size:12px;letter-spacing:.12em;color:#b9ae98;pointer-events:none}

const circles='<svg viewBox="0 0 120 120" width="86" height="86" fill="none"><circle cx="60" cy="60" r="56" stroke="#A9B8D6" stroke-width=".8"/><circle cx="60" cy="60" r="41" stroke="#1F9E98" stroke-width="1.2"/><circle cx="60" cy="60" r="26" stroke="#C99A3E" stroke-width="1.2"/><circle cx="60" cy="60" r="4.5" fill="#C99A3E"/></svg>';
const L=(u,t)=>`<a href="${u}" target="_blank" rel="noopener" style="color:inherit">${t}</a>`;
const PAGES=[
{c:"leather",t:"Cover",h:`<div class="cv"><div>${circles}<div class="sub" style="margin-top:1.4em">The Butterfly Effect</div></div><div><h1>Mohamed<br>Kasha</h1><div class="sub" style="margin-top:1em">Academic Portfolio &middot; 2026</div></div><div class="hint">Tap to open</div></div>`},
{c:"ivory",t:"About",h:`<div class="in"><img class="ph" src="${PHOTO}" alt="Mohamed Kasha"><div class="kick">About</div><h2>Digital heritage builder, community leader, UN Volunteer.</h2><p class="muted">Giza, Egypt<br>Also known as Mohamed Salah</p></div>`},
{c:"ivory",t:"Profile",h:`<div class="in"><div class="kick">Profile</div><h2>Close observation, turned into action.</h2><p>I built <b>Nubia Odyssey</b>, an Arabic-first digital archive of Nubian civilization, independently and without a team or funding. I also founded a peer-support initiative for 48 students and served as a UN Volunteer.</p><p class="muted">Seeking fully funded scholarships, fellowships and international programmes.</p><div class="stats"><div><b>29</b><span>village nodes</span></div><div><b>8</b><span>historical chapters</span></div><div><b>48</b><span>students supported</span></div><div><b>5</b><span>platforms built</span></div></div></div>`},
{c:"navy",t:"Nubia Odyssey",h:`<div class="in"><div class="kick">Flagship project &middot; 2026</div><h2 class="big">Nubia Odyssey</h2><p>An independent, Arabic-first digital archive of Nubian civilization.</p><div class="quote">&ldquo;The river does not forget, and we write.&rdquo;</div><div class="stats"><div><b>29</b><span>village nodes, Andan as model</span></div><div><b>96 s</b><span>opening film, 11 scenes</span></div></div><a class="btn" href="${CFG.archive}" target="_blank" rel="noopener">Open the live archive &#8599;</a></div>`},
{c:"ivory",t:"Method",h:`<div class="in"><div class="kick">How it works</div><h2>Feel first, then verify.</h2><ul class="ul"><li><b>Film first.</b> It opens with <i>Nubia Tells</i>, built from family photographs and Arabic narration.</li><li><b>Honest states.</b> Every place is marked documented, partially documented, or under review.</li><li><b>Source Room.</b> UNESCO, the Met Museum, UChicago ISAC, Warsaw and Michigan, linked in the journey.</li><li><b>Bounded AI.</b> The navigator states its limits.</li></ul><p class="muted" style="margin-top:auto">Built with no team, office or funding, from a mobile phone using Termux and AI-assisted tools.</p></div>`},
{c:"navy",t:"Research",h:`<div class="in"><div class="kick">Research &amp; publications</div><h2>Open, citable, traceable.</h2><ul class="ul"><li>Kasha, M. (2026). <i>Nubia Odyssey: An Independent Digital Archive of Nubian Civilization.</i> Zenodo, open access, v1. ${L(CFG.doi,"DOI 10.5281/zenodo.23256126")}</li><li>Case study: <i>An Arabic-First Interactive Atlas of Living Memory.</i> Zenodo, 2026.</li><li>ORCID ${L(CFG.orcid,"0009-0005-4400-5780")}</li></ul></div>`},
{c:"ivory",t:"Engagement",h:`<div class="in"><div class="kick">Academic engagement</div><h2>In dialogue with the field.</h2><ul class="ul"><li>Online meeting <b>scheduled 15 Oct 2026</b> with the lead of Nubian Chronicles, University of York.</li><li>Collaboration discussions initiated by a Nubian-history researcher at TCDH.</li></ul><div class="rule"></div><p class="muted"><b>Related work I build on and cite:</b> Digital Nubia (UCLA / Politecnico di Torino), Narrating Nubia (University of Michigan), Nubian Chronicles (York).</p></div>`},
{c:"navy",t:"Platforms",h:`<div class="in"><div class="kick">Other platforms &middot; 2026</div><h2>Tools for people.</h2><ul class="ul"><li><b>Nubian Memory Network.</b> A family-memory register: 45 villages, 3 tribal groups, 270 candidate families (documentation in progress). Prototype.</li><li><b>ForSa AI.</b> Egyptian-Arabic AI that helps women find income opportunities from everyday skills.</li><li><b>Scholara.</b> Scholarship matching driven by eligibility logic, not AI guesswork.</li><li><b>Bizna AI.</b> Diagnostics for small entrepreneurs.</li></ul></div>`},
{c:"ivory",t:"Service",h:`<div class="in"><div class="kick">Leadership &amp; education</div><h2>Service first.</h2><ul class="ul"><li><b>Peer Support Initiative</b> (2021 &ndash; present). After-school circles for students facing bullying and isolation; 48 students took part.</li><li><b>United Nations Volunteer</b> (Jun &ndash; Sep 2025).</li><li><b>B.Sc. track:</b> Information Technology, Institute of Advanced Studies, Egypt (enrolled).</li><li>CNN Academy, The Art of Storytelling (2025).</li></ul></div>`},
{c:"navy",t:"Principles",h:`<div class="in"><div class="kick">Principles</div><div class="quote" style="font-size:1.9em">An honest gap is better than a beautiful fact that cannot be traced.</div><div class="rule"></div><ul class="ul"><li>Begin with the face.</li><li>Keep the evidence inside the journey.</li><li>Leave the door open for correction.</li></ul></div>`},
{c:"ivory",t:"Contact",h:`<div class="in"><div class="kick">Contact</div><h2>Let&rsquo;s talk.</h2><ul class="ul"><li>${L("mailto:"+CFG.email,CFG.email)}</li><li>ORCID ${L(CFG.orcid,"0009-0005-4400-5780")}</li><li>Zenodo ${L(CFG.doi,"10.5281/zenodo.23256126")}</li><li>Archive ${L(CFG.archive,"Nubia Odyssey")}</li></ul><a class="btn" href="Mohamed_Kasha_CV_V15.pdf">Download CV &#8595;</a></div>`},
{c:"leather",t:"Back cover",h:`<div class="cv"><div>${circles}</div><div><div class="ar">النهر لا ينسى، ونحن نكتب</div><div class="sub" style="margin-top:1em">I turn what I observe into solutions that help people.</div></div><div class="sub">The Butterfly Effect</div></div>`}
];
const $=s=>document.querySelector(s),book=$("#book"),tilt=$("#tilt");
let mob=false,k=0,N=0,leaves=[],audio;
const root=document.documentElement;
function size(){mob=innerWidth<820;const ph=innerHeight-(mob?176:180);let p=mob?Math.min(innerWidth*.9,ph/1.32):Math.min(innerWidth*.43,ph/1.32,540);p=Math.max(240,p);
 root.style.setProperty("--p",p+"px");root.style.setProperty("--h",p*1.32+"px");root.style.setProperty("--bw",(mob?p:p*2)+"px");root.style.setProperty("--lx",(mob?0:p)+"px");return p}
function build(){const p=size();book.className="book"+(mob?" mob":"");book.innerHTML="";leaves=[];
 const mk=(f,b)=>{const el=document.createElement("div");el.className="leaf";el.innerHTML=`<div class="face front ${f.c}">${f.h}</div><div class="face back ${b?b.c:"blank"}">${b?b.h:""}</div>`;book.appendChild(el);leaves.push(el)};
 if(mob){PAGES.forEach(pg=>mk(pg,null));N=PAGES.length-1}else{for(let i=0;i<PAGES.length;i+=2)mk(PAGES[i],PAGES[i+1]);N=leaves.length}
 k=Math.min(k,N);dots();apply(false)}
function dots(){$("#dots").innerHTML=Array.from({length:N+1},(_,i)=>`<button data-i="${i}" aria-label="Go to page ${i+1}"><i></i></button>`).join("")}
function apply(snd=true){const n=leaves.length;leaves.forEach((el,i)=>{const f=i<k;el.classList.toggle("flipped",f);el.style.zIndex=f?i+1:n-i;el.style.transform=`translateZ(${f?i*.6:-i*.6}px) rotateY(${f?-180:0}deg)`});
 const p=parseFloat(getComputedStyle(root).getPropertyValue("--p"));book.style.setProperty("--sx",mob?"0px":(k==0?-p/2:(k==N?p/2:0))+"px");
 $$("#dots button").forEach((b,i)=>b.setAttribute("aria-current",i==k));
 $("#lab").textContent=mob?PAGES[k].t:(k==0?"Cover":k==N?"Back cover":PAGES[2*k-1].t+"  \u00b7  "+PAGES[2*k].t);
 $("#prev").disabled=k==0;$("#next").disabled=k==N;$("#prev").style.opacity=k==0?.35:1;$("#next").style.opacity=k==N?.35:1;if(snd)flip()}
const $$=s=>[...document.querySelectorAll(s)];
function go(i){const t=Math.max(0,Math.min(N,i));if(t!=k){k=t;apply()}}
function flip(){if(!$("#snd").getAttribute("aria-pressed")||$("#snd").getAttribute("aria-pressed")=="false")return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const a=audio,len=a.sampleRate*.28,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type="bandpass";f.frequency.setValueAtTime(1200,a.currentTime);f.frequency.exponentialRampToValueAtTime(5200,a.currentTime+.25);const g=a.createGain();g.gain.value=.14;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}catch(e){}}
$("#snd").onclick=e=>{const b=e.currentTarget;b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!="true")};
$("#prev").onclick=()=>go(k-1);$("#next").onclick=()=>go(k+1);
$("#dots").onclick=e=>{const b=e.target.closest("button");if(b)go(+b.dataset.i)};
book.addEventListener("click",e=>{if(e.target.closest("a,button"))return;const r=book.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;
 if(k==0)go(1);else if(k==N&&!mob)go(N-1);else if(mob)go(x>.4?k+1:k-1);else go(x>.5?k+1:k-1)});
addEventListener("keydown",e=>{if(e.key=="ArrowRight")go(k+1);if(e.key=="ArrowLeft")go(k-1);if(e.key=="Home")go(0);if(e.key=="End")go(N)});
let sx0=0,sy0=0;$("#stage").addEventListener("touchstart",e=>{sx0=e.touches[0].clientX;sy0=e.touches[0].clientY},{passive:true});
$("#stage").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx0,dy=e.changedTouches[0].clientY-sy0;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3)go(dx<0?k+1:k-1)},{passive:true});
if(!matchMedia("(prefers-reduced-motion:reduce)").matches)addEventListener("pointermove",e=>{if(e.pointerType=="touch")return;tilt.style.setProperty("--ry",((e.clientX/innerWidth-.5)*6)+"deg");tilt.style.setProperty("--rx",((.5-e.clientY/innerHeight)*4)+"deg")});
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(build,150)});
build();
</script>
